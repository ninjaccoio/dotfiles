; ==================================================
; SilentSDDM overrides
; ==================================================
;
; Questo file contiene solamente le personalizzazioni
; della nostra rice.
;
; La configurazione base rimane:
;
;   /usr/share/sddm/themes/silent/configs/default.conf
;
; Questo file viene caricato come:
;
;   default.conf.user
;
; e sovrascrive solamente le proprietà dichiarate qui.


; ==================================================
; General
; ==================================================

[General]

; Manteniamo le animazioni abilitate.
enable-animations = true


; ==================================================
; Lock screen
; ==================================================

[LockScreen]

; Per ora manteniamo il background fornito da SilentSDDM.
; Lo sostituiremo con il background della nostra rice quando
; costruiremo il sistema di theming condiviso.
background = "smoky.jpg"

; Nessun blur.
;
; Preferisco partire dall'immagine originale e decidere
; intenzionalmente in seguito se il nostro design richiede blur.
blur = 0


; ==================================================
; Clock
; ==================================================

[LockScreen.Clock]

; Formato 24 ore.
format = "HH:mm"


; ==================================================
; Date
; ==================================================

[LockScreen.Date]

; La schermata di login fa parte della nostra configurazione,
; quindi utilizziamo la locale italiana.
locale = "it_IT"


; ==================================================
; Lock screen message
; ==================================================

[LockScreen.Message]

; Testo mostrato prima di entrare nella schermata di login.
text = "Premi un tasto"